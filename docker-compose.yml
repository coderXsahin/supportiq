services:
  postgres:
    image: postgres:18
    container_name: supportiq-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supportiq
    ports:
      - "5433:5432"
    volumes:
      - supportiq-postgres-data:/var/lib/postgresql

  backend:
    image: supportiq-backend:latest
    container_name: supportiq-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/supportiq
    ports:
      - "8001:8001"
    depends_on:
      - postgres

  frontend:
    image: supportiq-frontend:latest
    container_name: supportiq-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  supportiq-postgres-data: